<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Segredos Sombrio do Digestório</title>
<style>
  body {
    background: #000;
    color: #00ff00;
    font-family: monospace;
    text-align: center;
    padding: 20px;
  }
  h1 {
    text-transform: uppercase;
    animation: pisca 1s infinite alternate;
  }
  @keyframes pisca {
    from { color: #00ff00; }
    to { color: #ff0000; }
  }
  .container {
    background: #111;
    padding: 20px;
    border-radius: 8px;
    margin: 0 auto;
    max-width: 600px;
    box-shadow: 0 0 20px #00ff00;
  }
  button {
    padding: 10px 20px;
    background: #00ff00;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    margin-top: 20px;
  }
  #fato {
    margin-top: 30px;
    font-size: 1.2rem;
    line-height: 1.6;
  }
</style>
</head>
<body>

<h1>⚠️ Verdades que ninguém te contou</h1>
<p>Prepare-se para segredos sombrios do seu próprio corpo...</p>

<div class="container">
  <div id="fato">Clique no botão abaixo para descobrir.</div>
  <button onclick="mostrarFato()">Revelar</button>
</div>

<script>
const fatos = [
  "🧠 Seu intestino tem cerca de 500 milhões de neurônios — por isso é chamado de 'segundo cérebro'.",
  "😱 Mais de 90% da serotonina, o neurotransmissor do 'bem-estar', é produzida no intestino, não no cérebro.",
  "☠️ A barreira intestinal é mais complexa e extensa do que a barreira hematoencefálica do cérebro.",
  "💀 A famosa 'barriga d'água' (ascite) não é água que você bebe, mas líquido acumulado por doenças graves como cirrose e câncer.",
  "🦠 Cerca de 100 trilhões de microrganismos vivem no seu intestino — você tem mais células bacterianas do que humanas.",
  "⚠️ Dormir do lado esquerdo após comer ajuda na digestão e reduz refluxo, graças à posição do estômago e esôfago.",
  "💩 A cada 10 pessoas, pelo menos 3 vivem com algum distúrbio intestinal silencioso sem saber.",
  "🧫 A acidez do estômago é forte o suficiente para corroer lâminas de metal — mas felizmente o seu revestimento gástrico se renova a cada poucos dias.",
  "👁️‍🗨️ Mais de 30 neurotransmissores diferentes já foram identificados atuando exclusivamente no trato gastrointestinal.",
  "🔒 Um desequilíbrio na microbiota intestinal pode influenciar diretamente seu humor, sono e até decisões impulsivas."
];

let indice = 0;

function mostrarFato() {
  if (indice < fatos.length) {
    document.getElementById("fato").innerHTML = fatos[indice];
    indice++;
  } else {
    document.getElementById("fato").innerHTML = "Você chegou ao fim… ou será que esses foram apenas os segredos permitidos?";
    document.querySelector("button").style.display = "none";
  }
}
</script>

</body>
</html>
